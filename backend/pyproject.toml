[project]
name = "ai-knowledge-inbox"
version = "1.0.0"
description = "Save notes and web pages, then ask cited questions over them."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "chromadb>=0.5.23,<0.6",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.55.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bs4.*", "chromadb.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]
